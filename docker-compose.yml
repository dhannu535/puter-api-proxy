services:
  puter-proxy:
    build: .
    container_name: puter-proxy
    ports:
      - "${PORT:-3800}:3800"
    env_file:
      - .env
    environment:
      - PORT=3800
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3800/puter-api-proxy/health"]
      interval: 30s
      timeout: 10s
      retries: 3
